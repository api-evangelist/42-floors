name: 42 Floors
description: >-
  42Floors was a Y Combinator- and 500 Global-backed commercial real estate
  search platform founded in 2011 by Jason Freedman to make it easy to discover
  and lease office, coworking, retail, industrial, and warehouse space across
  top U.S. markets. It aggregated a large listings database (the "42Floors MLS")
  that brokers and tenants searched online. The company was acquired by Knotel in
  2018, and the 42floors.com domain and listings service were later taken over by
  Yardi, which folded them into CommercialCafe — 42floors.com now redirects there.
  The only surviving developer surface is the first-party `mls` RubyGem, a client
  for the (now-decommissioned) 42Floors MLS API at mls.42floors.com.
